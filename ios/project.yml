# XcodeGen spec (CI runs `xcodegen generate`; the .xcodeproj is not committed). No packages, no secrets in the repo.
name: YYCSystems
options:
  bundleIdPrefix: dev.de0ch
  deploymentTarget: { iOS: "18.0" }
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: S64YL394S3
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "$(BUILD_NUMBER)"
    BUILD_NUMBER: "1"
    SWIFT_VERSION: "5.9"
targets:
  YYCSystems:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.de0ch.yycsystems
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: YYC Systems
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: { UIColorName: Ground }
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        UIUserInterfaceStyle: Dark
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        LSRequiresIPhoneOS: true
        # the CI replica's stub server on the simulator's own loopback (127.0.0.1); the real site is HTTPS
        NSAppTransportSecurity: { NSAllowsLocalNetworking: true }
  YYCSystemsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: YYCSystems
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.de0ch.yycsystems.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  YYCSystems:
    build: { targets: { YYCSystems: all, YYCSystemsUITests: [test] } }
    test: { targets: [YYCSystemsUITests] }
